name: checkout-observability

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    expose:
      - "4317"
    ports:
      - target: 16686
        published: "16686"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test:
        - CMD
        - /usr/bin/wget
        - --quiet
        - --spider
        - http://127.0.0.1:13133/status
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - service-network
      - edge-network

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command:
      - --config=/etc/otelcol/config.yaml
    depends_on:
      jaeger:
        condition: service_healthy
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro,Z
    expose:
      - "4318"
      - "13133"
    healthcheck:
      test:
        - CMD
        - /otelcol
        - validate
        - --config=/etc/otelcol/config.yaml
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - service-network

  inventory-api:
    build:
      context: .
      dockerfile: services/inventory_api/Dockerfile
    environment:
      APP_ENV: local
      ENABLE_LOCAL_SIMULATIONS: "true"
      SIMULATED_DELAY_SECONDS: "1.0"
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - service-network

  checkout-api:
    build:
      context: .
      dockerfile: services/checkout_api/Dockerfile
    depends_on:
      inventory-api:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      APP_ENV: local
      ENABLE_LOCAL_SIMULATIONS: "true"
      INVENTORY_API_URL: http://inventory-api:8001
      INVENTORY_HTTP_TIMEOUT_SECONDS: "2.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - target: 8000
        published: "8000"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - service-network
      - edge-network

networks:
  service-network:
    internal: true
  edge-network:
    driver: bridge
