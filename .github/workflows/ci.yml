name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Check Python syntax
        run: python -m compileall -q services shared tests

      - name: Run tests
        run: python -m pytest

  container-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Generate local Grafana credentials
        run: |
          install -d -m 700 .local-secrets
          umask 077
          openssl rand -hex 32 | tr -d '\n' > .local-secrets/grafana_admin_password

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Exercise checkout path
        run: |
          curl --fail-with-body \
            --request POST http://127.0.0.1:8000/checkout \
            --header 'content-type: application/json' \
            --data '{"product_id":"SKU-001","quantity":2,"scenario":"normal"}'

      - name: Verify distributed trace reached Jaeger
        run: |
          python - <<'PY'
          import datetime
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          now = datetime.datetime.now(datetime.UTC)
          query = urllib.parse.urlencode({
              "query.service_name": "checkout-api",
              "query.operation_name": "checkout.process",
              "query.start_time_min": (now - datetime.timedelta(minutes=2)).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "query.start_time_max": (now + datetime.timedelta(minutes=1)).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "query.search_depth": "20",
          })
          url = f"http://127.0.0.1:16686/api/v3/traces?{query}"

          spans = []
          for _ in range(15):
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
                  data = {}

              spans = []
              for resource_spans in data.get("result", {}).get("resourceSpans", []):
                  service_name = next(
                      attribute["value"]["stringValue"]
                      for attribute in resource_spans["resource"]["attributes"]
                      if attribute["key"] == "service.name"
                  )
                  for scope_spans in resource_spans.get("scopeSpans", []):
                      for span in scope_spans.get("spans", []):
                          spans.append((service_name, span))

              if len(spans) == 5:
                  break
              time.sleep(1)

          by_key = {(service, span["name"]): span for service, span in spans}
          required = {
              ("checkout-api", "POST /checkout"),
              ("checkout-api", "checkout.process"),
              ("checkout-api", "POST"),
              ("inventory-api", "POST /check"),
              ("inventory-api", "inventory.lookup"),
          }
          if set(by_key) != required:
              raise SystemExit(f"unexpected distributed trace spans: {sorted(by_key)}")

          checkout_server = by_key[("checkout-api", "POST /checkout")]
          checkout_process = by_key[("checkout-api", "checkout.process")]
          http_client = by_key[("checkout-api", "POST")]
          inventory_server = by_key[("inventory-api", "POST /check")]
          inventory_lookup = by_key[("inventory-api", "inventory.lookup")]
          if len({span["traceId"] for _, span in spans}) != 1:
              raise SystemExit("spans do not share one trace ID")
          expected_parents = {
              checkout_process["spanId"]: checkout_server["spanId"],
              http_client["spanId"]: checkout_process["spanId"],
              inventory_server["spanId"]: http_client["spanId"],
              inventory_lookup["spanId"]: inventory_server["spanId"],
          }
          for span_id, expected_parent in expected_parents.items():
              span = next(span for _, span in spans if span["spanId"] == span_id)
              if span.get("parentSpanId") != expected_parent:
                  raise SystemExit(f"incorrect parent for span {span_id}")
          PY

      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
