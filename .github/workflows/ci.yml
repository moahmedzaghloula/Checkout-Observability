name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Check Python syntax
        run: python -m compileall -q services shared scripts tests

      - name: Run tests
        run: python -m pytest

  container-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Generate local Grafana credentials
        run: |
          install -d -m 700 .local-secrets
          umask 077
          openssl rand -hex 32 | tr -d '\n' > .local-secrets/grafana_admin_password

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Verify application and observability contracts
        run: python scripts/verify_stack.py

      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
