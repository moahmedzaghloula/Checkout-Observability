name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Check Python syntax
        run: python -m compileall -q services shared tests

      - name: Run tests
        run: python -m pytest

  container-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up --detach --wait --wait-timeout 60

      - name: Exercise checkout path
        run: |
          curl --fail-with-body \
            --request POST http://127.0.0.1:8000/checkout \
            --header 'content-type: application/json' \
            --data '{"product_id":"SKU-001","quantity":2,"scenario":"normal"}'

      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
